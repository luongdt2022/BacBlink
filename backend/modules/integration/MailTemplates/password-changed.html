<!-- Port từ `src/mail/templates/password-changed.hbs`. -->
<div style="font-family:'Segoe UI',Arial,sans-serif;max-width:600px;margin:0 auto;color:#12365a">
  <h2 style="color:#12365a">Mật khẩu đã được thay đổi</h2>
  <p>Xin chào {{firstName}},</p>
  <p>Mật khẩu của tài khoản <strong>{{email}}</strong> vừa được thay đổi.</p>
  <table style="border-collapse:collapse;font-size:14px;margin:20px 0">
    <tr><td style="padding:6px 12px 6px 0;color:#52687a">Thời điểm</td><td style="padding:6px 0"><strong>{{changedAt}}</strong></td></tr>
    <tr><td style="padding:6px 12px 6px 0;color:#52687a">Địa chỉ IP</td><td style="padding:6px 0">{{ipAddress}}</td></tr>
    <tr><td style="padding:6px 12px 6px 0;color:#52687a">Thiết bị</td><td style="padding:6px 0">{{userAgent}}</td></tr>
  </table>
  <p>Nếu không phải bạn thực hiện thay đổi này, hãy liên hệ ngay với chúng tôi.</p>
  <p style="margin:24px 0"><a href="{{supportLink}}">Liên hệ hỗ trợ</a></p>
  <p style="font-size:13px;color:#52687a">{{companyName}}</p>
</div>
