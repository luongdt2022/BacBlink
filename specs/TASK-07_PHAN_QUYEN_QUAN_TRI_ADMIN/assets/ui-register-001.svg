<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830" role="img" aria-labelledby="title desc">
<title id="title">UI-REGISTER-001 — Wireframe đăng ký nhanh</title><desc id="desc">Wireframe form đăng ký với callout 01 đến 07 cho thông tin cá nhân, mật khẩu, đồng ý PDPD, tạo tài khoản và đăng nhập.</desc>
<style>text{font-family:Arial,sans-serif;fill:#172554}.t{font-size:25px;font-weight:700}.s{font-size:16px}.l{font-size:17px;font-weight:700}.n{font-size:14px;font-weight:700;fill:#fff}.mut{fill:#64748b}.box{fill:#fff;stroke:#94a3b8;stroke-width:2}.primary{fill:#1d4ed8}.tag{fill:#e0e7ff}.line{stroke:#cbd5e1;stroke-width:2}</style>
<rect width="1200" height="830" fill="#f8fafc"/><rect x="90" y="32" width="1020" height="762" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="600" y="88" text-anchor="middle" class="t">ĐĂNG KÝ TÀI KHOẢN MỚI</text><text x="600" y="117" text-anchor="middle" class="s mut">Tạo tài khoản cơ bản để tra cứu và học tập</text>
<text x="265" y="177" text-anchor="end" class="l">Họ và tên</text><rect x="285" y="149" width="550" height="48" rx="7" class="box"/><text x="305" y="180" class="s mut">Nguyễn Văn A</text><rect x="247" y="159" width="28" height="28" rx="14" class="tag"/><text x="261" y="179" text-anchor="middle" class="n">01</text>
<text x="265" y="246" text-anchor="end" class="l">Email đăng ký</text><rect x="285" y="218" width="550" height="48" rx="7" class="box"/><text x="305" y="249" class="s mut">email@example.vn</text><rect x="247" y="228" width="28" height="28" rx="14" class="tag"/><text x="261" y="248" text-anchor="middle" class="n">02</text>
<text x="265" y="315" text-anchor="end" class="l">Mật khẩu</text><rect x="285" y="287" width="550" height="48" rx="7" class="box"/><text x="305" y="318" class="s mut">••••••••••••</text><rect x="247" y="297" width="28" height="28" rx="14" class="tag"/><text x="261" y="317" text-anchor="middle" class="n">03</text><rect x="285" y="351" width="155" height="8" rx="4" fill="#22c55e"/><rect x="450" y="351" width="155" height="8" rx="4" fill="#e2e8f0"/><rect x="615" y="351" width="155" height="8" rx="4" fill="#e2e8f0"/><text x="785" y="361" class="s mut">Độ mạnh: Mạnh</text>
<text x="265" y="422" text-anchor="end" class="l">Nhập lại mật khẩu</text><rect x="285" y="394" width="550" height="48" rx="7" class="box"/><text x="305" y="425" class="s mut">••••••••••••</text><rect x="247" y="404" width="28" height="28" rx="14" class="tag"/><text x="261" y="424" text-anchor="middle" class="n">04</text>
<rect x="285" y="486" width="20" height="20" rx="3" class="box"/><text x="320" y="503" class="s">Tôi đồng ý với Điều khoản sử dụng và Chính sách PDPD (NĐ 13/2023/NĐ-CP)</text><rect x="247" y="483" width="28" height="28" rx="14" class="tag"/><text x="261" y="503" text-anchor="middle" class="n">05</text>
<rect x="285" y="555" width="300" height="54" rx="8" class="primary"/><text x="435" y="589" text-anchor="middle" class="l" fill="#fff">TẠO TÀI KHOẢN</text><rect x="595" y="568" width="28" height="28" rx="14" class="tag"/><text x="609" y="588" text-anchor="middle" class="n">06</text><text x="600" y="670" text-anchor="middle" class="s mut">Đã có tài khoản? </text><text x="722" y="670" class="s" fill="#1d4ed8">Đăng nhập ngay</text><rect x="825" y="653" width="28" height="28" rx="14" class="tag"/><text x="839" y="673" text-anchor="middle" class="n">07</text>
