<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
<title id="title">UI-LOGIN-001 — Wireframe đăng nhập đa kênh</title><desc id="desc">Wireframe có các callout từ 01 đến 08: Google, VNeID, email, mật khẩu, hiện mật khẩu, ghi nhớ, quên mật khẩu và đăng nhập.</desc>
<style>text{font-family:Arial,sans-serif;fill:#172554}.t{font-size:25px;font-weight:700}.s{font-size:16px}.l{font-size:18px;font-weight:700}.n{font-size:14px;font-weight:700;fill:#fff}.mut{fill:#64748b}.box{fill:#fff;stroke:#94a3b8;stroke-width:2}.primary{fill:#1d4ed8}.tag{fill:#e0e7ff}.disabled{fill:#e2e8f0}.line{stroke:#cbd5e1;stroke-width:2}</style>
<rect width="1200" height="780" fill="#f8fafc"/><rect x="40" y="34" width="1120" height="712" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="600" y="92" text-anchor="middle" class="t">HỆ THỐNG NACENTECH</text><text x="600" y="122" text-anchor="middle" class="s mut">Đăng nhập Nền tảng Dữ liệu</text>
<rect x="385" y="162" width="430" height="54" rx="8" class="box"/><circle cx="418" cy="189" r="12" fill="#ea4335"/><text x="600" y="196" text-anchor="middle" class="l">Tiếp tục với Google</text><rect x="350" y="173" width="28" height="28" rx="14" class="tag"/><text x="364" y="193" text-anchor="middle" class="n">01</text>
<rect x="385" y="230" width="430" height="54" rx="8" class="disabled"/><text x="600" y="264" text-anchor="middle" class="l" fill="#64748b">Đăng nhập qua VNeID</text><text x="750" y="255" class="s mut">Sắp ra mắt</text><rect x="350" y="241" width="28" height="28" rx="14" class="tag"/><text x="364" y="261" text-anchor="middle" class="n">02</text>
<line x1="385" y1="322" x2="555" y2="322" class="line"/><text x="600" y="328" text-anchor="middle" class="s mut">HOẶC</text><line x1="645" y1="322" x2="815" y2="322" class="line"/>
<text x="385" y="368" class="l">Email</text><rect x="385" y="380" width="430" height="50" rx="7" class="box"/><text x="404" y="412" class="s mut">name@company.vn</text><rect x="350" y="391" width="28" height="28" rx="14" class="tag"/><text x="364" y="411" text-anchor="middle" class="n">03</text>
<text x="385" y="469" class="l">Mật khẩu</text><rect x="385" y="481" width="430" height="50" rx="7" class="box"/><text x="404" y="513" class="s mut">••••••••••••</text><text x="770" y="513" class="s">Hiện</text><rect x="825" y="491" width="28" height="28" rx="14" class="tag"/><text x="839" y="511" text-anchor="middle" class="n">05</text><rect x="350" y="492" width="28" height="28" rx="14" class="tag"/><text x="364" y="512" text-anchor="middle" class="n">04</text>
<rect x="385" y="557" width="18" height="18" rx="3" class="box"/><text x="412" y="572" class="s">Ghi nhớ đăng nhập</text><rect x="350" y="553" width="28" height="28" rx="14" class="tag"/><text x="364" y="573" text-anchor="middle" class="n">06</text><text x="680" y="572" class="s" fill="#1d4ed8">Quên mật khẩu?</text><rect x="815" y="553" width="28" height="28" rx="14" class="tag"/><text x="829" y="573" text-anchor="middle" class="n">07</text>
<rect x="385" y="608" width="430" height="54" rx="8" class="primary"/><text x="600" y="642" text-anchor="middle" class="l" fill="#fff">ĐĂNG NHẬP</text><rect x="825" y="621" width="28" height="28" rx="14" class="tag"/><text x="839" y="641" text-anchor="middle" class="n">08</text><text x="600" y="704" text-anchor="middle" class="s mut">Chưa có tài khoản?  Đăng ký ngay</text>
</svg>
