services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3001}
        VITE_API_PREFIX: ${VITE_API_PREFIX:-api}
        VITE_API_VERSION: ${VITE_API_VERSION:-v1}
    ports:
      - "3012:3000"
    restart: unless-stopped
