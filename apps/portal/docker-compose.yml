services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_APP_NAME: ${VITE_APP_NAME}
        VITE_APP_VERSION: ${VITE_APP_VERSION}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    image: dmst-user-role:latest
    container_name: dmst-user-role
    restart: unless-stopped
    ports:
      - "${PORT:-3011}:8080"
    environment:
      - PORT=3011
