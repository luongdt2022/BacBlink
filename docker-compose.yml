# Môi trường phát triển/diễn tập cutover. Không phải cấu hình production:
# production cần S3 + Object Lock (D2-24), KMS, và secret không nằm trong file.
name: nacentech

services:
  postgres:
    # ADR-0010: chỉ mục tìm kiếm nằm trong PostgreSQL — ảnh có sẵn extension `vector`; Elasticsearch đã gỡ.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${DB_NAME:-nacentech}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-55440}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-nacentech}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      args:
        APP: apps/api
        ASSEMBLY: NacenTech.Api
    ports:
      - "${API_PORT:-5000}:8080"
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${DB_NAME:-nacentech};Username=${DB_USER:-postgres};Password=${DB_PASSWORD:-postgres}
      Auth__SigningKey: ${AUTH_SIGNING_KEY:?Đặt AUTH_SIGNING_KEY ≥ 32 byte, không có giá trị mặc định}
      Auth__FrontendUrl: ${FRONTEND_URL:-http://localhost:5173}
      Communication__FrontendUrl: ${FRONTEND_URL:-http://localhost:5173}
      Cors__Origins__0: ${FRONTEND_URL:-http://localhost:5173}
      Cors__Origins__1: ${ADMIN_URL:-http://localhost:5174}
      ObjectStorage__PublicBaseUrl: ${API_PUBLIC_URL:-http://localhost:5000}
      Matching__EmbeddingBaseUrl: ${RAG_URL:-http://host.docker.internal:8003}
      Api__RunWorkersInProcess: "false"
      Api__MigrateOnStartup: "true"
      Mail__DryRun: ${MAIL_DRY_RUN:-true}
      Mail__Host: ${MAIL_HOST:-smtp.gmail.com}
      Mail__Port: ${MAIL_PORT:-587}
      Mail__UseStartTls: ${MAIL_USE_STARTTLS:-true}
      Mail__UseSsl: ${MAIL_USE_SSL:-false}
      Mail__User: ${MAIL_USER:-}
      Mail__Password: ${MAIL_PASSWORD:-}
      Mail__From: ${MAIL_FROM:-}
      Mail__FromName: ${MAIL_FROM_NAME:-NacenTech}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - storage_data:/app/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  worker:
    build:
      context: .
      args:
        APP: apps/worker
        ASSEMBLY: NacenTech.Worker
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${DB_NAME:-nacentech};Username=${DB_USER:-postgres};Password=${DB_PASSWORD:-postgres}
      Communication__FrontendUrl: ${FRONTEND_URL:-http://localhost:5173}
      ObjectStorage__PublicBaseUrl: ${API_PUBLIC_URL:-http://localhost:5000}
      Matching__EmbeddingBaseUrl: ${RAG_URL:-http://host.docker.internal:8003}
      Mail__DryRun: ${MAIL_DRY_RUN:-true}
      Mail__Host: ${MAIL_HOST:-smtp.gmail.com}
      Mail__Port: ${MAIL_PORT:-587}
      Mail__UseStartTls: ${MAIL_USE_STARTTLS:-true}
      Mail__UseSsl: ${MAIL_USE_SSL:-false}
      Mail__User: ${MAIL_USER:-}
      Mail__Password: ${MAIL_PASSWORD:-}
      Mail__From: ${MAIL_FROM:-}
      Mail__FromName: ${MAIL_FROM_NAME:-NacenTech}
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    volumes:
      - storage_data:/app/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  postgres_data:
  storage_data:
