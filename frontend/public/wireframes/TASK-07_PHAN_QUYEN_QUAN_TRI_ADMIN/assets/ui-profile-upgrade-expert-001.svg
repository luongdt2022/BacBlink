<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">UI-PROFILE-UPGRADE-001 — Tab Chuyên gia, hồ sơ nâng cấp ba bước</title><desc id="desc">Wireframe thể hiện ba bước: xác minh danh tính, năng lực chuyên môn, và hồ sơ khoa học tư vấn. Bước hai đang được hiển thị.</desc>
<style>text{font-family:Arial,sans-serif;fill:#172554}.t{font-size:24px;font-weight:700}.h{font-size:17px;font-weight:700}.s{font-size:14px}.xs{font-size:12px}.n{font-size:12px;font-weight:700;fill:#fff}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.active{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.primary{fill:#1d4ed8}.tag{fill:#e0e7ff}.mut{fill:#64748b}.dash{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:6 5}</style>
<rect width="1200" height="900" fill="#f8fafc"/><rect x="45" y="28" width="1110" height="842" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="600" y="76" text-anchor="middle" class="t">NÂNG CẤP HỒ SƠ — CHUYÊN GIA KHOA HỌC</text>
<rect x="175" y="101" width="330" height="46" rx="8" class="box"/><text x="340" y="130" text-anchor="middle" class="h">DOANH NGHIỆP</text><rect x="520" y="101" width="330" height="46" rx="8" class="active"/><text x="685" y="130" text-anchor="middle" class="h">CHUYÊN GIA KHOA HỌC</text><rect x="860" y="110" width="28" height="28" rx="14" class="tag"/><text x="874" y="130" text-anchor="middle" class="n">E01</text>
<line x1="240" y1="191" x2="910" y2="191" stroke="#cbd5e1" stroke-width="4"/><circle cx="300" cy="191" r="18" fill="#2563eb"/><text x="300" y="196" text-anchor="middle" class="n">1</text><circle cx="600" cy="191" r="18" fill="#2563eb"/><text x="600" y="196" text-anchor="middle" class="n">2</text><circle cx="900" cy="191" r="18" fill="#cbd5e1"/><text x="900" y="196" text-anchor="middle" class="s">3</text><text x="300" y="225" text-anchor="middle" class="s">Xác minh danh tính</text><text x="600" y="225" text-anchor="middle" class="h">Năng lực chuyên môn</text><text x="900" y="225" text-anchor="middle" class="s">Hồ sơ khoa học &amp; tư vấn</text><rect x="930" y="177" width="28" height="28" rx="14" class="tag"/><text x="944" y="197" text-anchor="middle" class="n">E02</text>
