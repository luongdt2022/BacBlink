<text x="365" y="445" text-anchor="end" class="h">Chức danh / Chức vụ *</text><rect x="385" y="418" width="575" height="46" rx="6" class="box"/><text x="404" y="447" class="s mut">Nghiên cứu viên chính · Trưởng bộ môn</text><rect x="347" y="427" width="28" height="28" rx="14" class="tag"/><text x="361" y="447" text-anchor="middle" class="n">E04</text>
