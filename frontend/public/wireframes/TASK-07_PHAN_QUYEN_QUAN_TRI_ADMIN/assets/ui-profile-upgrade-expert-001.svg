<text x="365" y="655" text-anchor="end" class="h">Kinh nghiệm tóm tắt *</text><rect x="385" y="628" width="575" height="76" rx="6" class="box"/><text x="404" y="657" class="s mut">Nêu quá trình công tác, kỹ năng và năng lực nổi bật...</text><rect x="347" y="637" width="28" height="28" rx="14" class="tag"/><text x="361" y="657" text-anchor="middle" class="n">E07</text>
<rect x="140" y="785" width="170" height="48" rx="7" class="box"/><text x="225" y="816" text-anchor="middle" class="h">Quay lại</text><rect x="790" y="785" width="170" height="48" rx="7" class="primary"/><text x="875" y="816" text-anchor="middle" class="h" fill="#fff">Tiếp tục</text><rect x="970" y="795" width="28" height="28" rx="14" class="tag"/><text x="984" y="815" text-anchor="middle" class="n">E08</text>
<rect x="960" y="258" width="28" height="28" rx="14" class="tag"/><text x="974" y="278" text-anchor="middle" class="n">E09–E13</text><text x="860" y="746" text-anchor="middle" class="xs mut">Bước 3 gồm LLKH/CV, minh chứng, thành tựu, dịch vụ và cam kết.</text>
